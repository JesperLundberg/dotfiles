# --- Basics ---
set -g mouse on                     # Easy scrolling and text selection
set -g history-limit 10000          # More scrollback
set -g base-index 1                 # Windows start at 1
setw -g pane-base-index 1           # Panes start at 1
set -g renumber-windows on          # Keep window numbering compact

set -g bell-action none             # No terminal bell over SSH
set -g escape-time 0                # Immediate Escape response
set -sg repeat-time 500             # Timeout for repeated prefix commands
set-option -g allow-rename off      # Prevent tmux from renaming windows

# --- Keys & navigation ---
unbind C-b
set -g prefix C-a                   # More natural prefix, like screen
bind C-a send-prefix
bind r source-file ~/.tmux.conf \; display-message "Reloaded!"

# Splits
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Switch panes with Alt + arrow keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- Quality of life ---
set -g status-interval 1            # Keep clock/status information current
set -g status-keys vi
setw -g mode-keys vi
set -g focus-events on              # Allow applications to receive focus events

set -g set-titles on
set -g set-titles-string '#H: #W'

# --- Clipboard ---
# Use OSC 52 to copy through the terminal connection to the local client.
# This works without requiring xclip or an X server on the remote host.
set -s set-clipboard on
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# --- Appearance ---
set -g status-position bottom
set -g status-bg colour236
set -g status-fg white
set -g status-left-length 40
set -g status-right-length 100

set -g status-left '#[fg=green][#S]#[default]'
set -g status-right '#[fg=cyan]%Y-%m-%d %H:%M#[default] #[fg=yellow]#H#[default]'

# Highlight the active window
setw -g window-status-current-format '#[fg=black,bg=green] #I:#W #[default]'
setw -g window-status-format '#[fg=white,bg=colour236] #I:#W #[default]'

# --- Session behavior ---
set -g exit-empty off
set -g detach-on-destroy off
